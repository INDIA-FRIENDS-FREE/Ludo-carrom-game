 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo & Carrom Multi-Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAGE 1: WELCOME SCREEN -->
    <div id="page-1" class="page active">
        <div class="welcome-container">
            <h1>Welcome to the Game! 🎮</h1>
            <p>लूडो और कैरम की दुनिया में आपका स्वागत है</p>
            
            <div class="input-group">
                <label for="username">अपना सुंदर सा नाम लिखिए:</label>
                <input type="text" id="username" placeholder="यहाँ नाम डालें (जैसे: Rahul)...">
            </div>

            <div class="game-choice">
                <h3>आप क्या खेलना चाहते हैं?</h3>
                <button class="btn btn-ludo" onclick="goToLudoPage()">🎲 लूडो (Ludo)</button>
                <button class="btn btn-carrom" onclick="goToCarromPage()">⚪ कैरम (Carrom)</button>
            </div>
        </div>
    </div>

    <!-- PAGE 2: LUDO SCREEN -->
    <div id="page-2" class="page">
        <!-- सेटअप स्क्रीन -->
        <div id="ludo-setup" class="game-setup-container">
            <h2>🎲 Ludo Game Setup</h2>
            <p id="ludo-welcome-msg" class="welcome-tag"></p>
            
            <button id="ludo-vol-btn" class="vol-btn" onclick="toggleVolume('ludo')">🔊 Volume: ON</button>

            <div class="mode-selection">
                <h3>खेलने का तरीका चुनें:</h3>
                <button class="btn btn-mode" onclick="selectLudoMode('computer')">🤖 Computer vs Me</button>
                <button class="btn btn-mode" onclick="selectLudoMode('friends')">👥 Play with Friends</button>
            </div>

            <div id="ludo-players-section" class="players-section">
                <h3>कितने लोग खेलेंगे?</h3>
                <div class="player-options">
                    <button class="btn-player" onclick="startLudoGameplay(2)">2 Players</button>
                    <button class="btn-player" onclick="startLudoGameplay(3)">3 Players</button>
                    <button class="btn-player" onclick="startLudoGameplay(4)">4 Players</button>
                </div>
            </div>

            <button class="btn btn-back" onclick="backToHome()">⬅️ पीछे जाएँ</button>
        </div>

        <!-- असली लूडो गेमप्ले स्क्रीन (शुरू में छुपी रहेगी) -->
        <div id="ludo-gameplay" class="ludo-gameplay" style="display: none;">
            <div class="gameplay-header">
                <span id="ludo-turn-indicator">🔴 Red Turn</span>
                <button class="btn-exit" onclick="exitLudoGameplay()">❌ Exit</button>
            </div>
            
            <!-- लूडo का सुंदर CSS बोर्ड -->
            <div class="ludo-board">
                <div class="house red-house"><span>RED</span></div>
                <div class="path top-path"></div>
                <div class="house green-house"><span>GREEN</span></div>
                <div class="path left-path"></div>
                <div class="home-center"><span>HOME</span></div>
                <div class="path right-path"></div>
                <div class="house yellow-house"><span>YELLOW</span></div>
                <div class="path bottom-path"></div>
                <div class="house blue-house"><span>BLUE</span></div>
            </div>

            <!-- पासा (Dice) फेंकने का एरिया -->
            <div class="dice-container">
                <div id="ludo-dice" class="dice">1</div>
                <button class="btn-roll" onclick="rollLudoDice()">🎲 Roll Dice</button>
            </div>
        </div>
    </div>

    <!-- PAGE 3: CARROM SCREEN -->
    <div id="page-3" class="page">
        <div class="game-setup-container">
            <h2>⚪ Carrom Game Setup</h2>
            <p id="carrom-welcome-msg" class="welcome-tag"></p>
            
            <button id="carrom-vol-btn" class="vol-btn" onclick="toggleVolume('carrom')">🔊 Volume: ON</button>

            <div class="mode-selection">
                <h3>खेलने का तरीका चुनें:</h3>
                <button class="btn btn-mode" onclick="selectCarromMode('computer')">🤖 Computer vs Me</button>
                <button class="btn btn-mode" onclick="selectCarromMode('friends')">👥 Play with Friends</button>
            </div>

            <div id="carrom-players-section" class="players-section">
                <h3>कितने लोग खेलेंगे?</h3>
                <div class="player-options">
                    <button class="btn-player" onclick="setPlayers('carrom', 2)">2 Players</button>
                    <button class="btn-player" onclick="setPlayers('carrom', 3)">3 Players</button>
                    <button class="btn-player" onclick="setPlayers('carrom', 4)">4 Players</button>
                </div>
            </div>

            <button class="btn btn-back" onclick="backToHome()">⬅️ पीछे जाएँ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
