 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo & Carrom Multi-Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAGE 1: WELCOME SCREEN -->
    <div id="page-1" class="page active">
        <div class="welcome-container">
            <h1>Welcome to the Game! 🎮</h1>
            <p>लूडो और कैरम की दुनिया में आपका स्वागत है</p>
            <div class="input-group">
                <label for="username">अपना सुंदर सा नाम लिखिए:</label>
                <input type="text" id="username" placeholder="यहाँ नाम डालें...">
            </div>
            <div class="game-choice">
                <h3>आप क्या खेलना चाहते हैं?</h3>
                <button class="btn btn-ludo" onclick="openLudo()">🎲 लूडो (Ludo)</button>
                <button class="btn btn-carrom" onclick="openCarrom()">⚪ कैरम (Carrom)</button>
            </div>
        </div>
    </div>

    <!-- PAGE 2: LUDO SCREEN -->
    <div id="page-2" class="page">
        <div id="ludo-setup" class="game-setup-container">
            <h2>🎲 Ludo Game Setup</h2>
            <p id="ludo-user" class="welcome-tag"></p>
            <button id="ludo-vol-btn" class="vol-btn" onclick="toggleVolume('ludo')">🔊 Volume: ON</button>
            
            <div class="mode-selection">
                <h3>खेलने का तरीका चुनें:</h3>
                <button class="btn btn-mode" onclick="selectLudoMode('computer')">🤖 Computer vs Me</button>
                <button class="btn btn-mode" onclick="selectLudoMode('friends')">👥 Play with Friends</button>
            </div>

            <div id="ludo-players-section" class="players-section" style="display: none;">
                <h3>कितने लोग खेलेंगे?</h3>
                <div class="player-options">
                    <button class="btn-player" onclick="startLudoGame(2)">2 Players</button>
                    <button class="btn-player" onclick="startLudoGame(3)">3 Players</button>
                    <button class="btn-player" onclick="startLudoGame(4)">4 Players</button>
                </div>
            </div>
            <br><br>
            <button class="btn btn-back" onclick="backHome()">⬅ पीछे जाएँ</button>
        </div>

        <!-- लूडो असली गेमप्ले -->
        <div id="ludo-gameplay" style="display: none;">
            <h2 id="ludo-turn">🔴 Red Turn</h2>
            <div class="gameplay-box">
                <div class="board-image-container">
                    <img src="ludo.jpg" alt="Ludo Board">
                </div>
                <div id="dice-num" class="dice-view">1</div>
                <button class="btn-roll" onclick="rollDice()">🎲 पासा फेंकें (Roll)</button>
            </div>
            <br>
            <button class="btn btn-back" onclick="exitLudo()">❌ खेल बंद करें</button>
        </div>
    </div>

    <!-- PAGE 3: CARROM SCREEN -->
    <div id="page-3" class="page">
        <div id="carrom-setup" class="game-setup-container">
            <h2>⚪ Carrom Game Setup</h2>
            <p id="carrom-user" class="welcome-tag"></p>
            <button id="carrom-vol-btn" class="vol-btn" onclick="toggleVolume('carrom')">🔊 Volume: ON</button>
            
            <div class="mode-selection">
                <h3>खेलने का तरीका चुनें:</h3>
                <button class="btn btn-mode" onclick="selectCarromMode('computer')">🤖 Computer vs Me</button>
                <button class="btn btn-mode" onclick="selectCarromMode('friends')">👥 Play with Friends</button>
            </div>

            <div id="carrom-players-section" class="players-section" style="display: none;">
                <h3>कितने लोग खेलेंगे?</h3>
                <div class="player-options">
                    <button class="btn-player" onclick="startCarromGame(2)">2 Players</button>
                    <button class="btn-player" onclick="startCarromGame(3)">3 Players</button>
                    <button class="btn-player" onclick="startCarromGame(4)">4 Players</button>
                </div>
            </div>
            <br><br>
            <button class="btn btn-back" onclick="backHome()">⬅ पीछे जाएँ</button>
        </div>

        <!-- कैरम असली गेमप्ले -->
        <div id="carrom-gameplay" style="display: none;">
            <h2 id="carrom-turn-indicator">⚪ White Turn</h2>
            <div class="gameplay-box">
                <div class="board-image-container">
                    <img src="carrom.jpg" alt="Carrom Board">
                </div>
                <div class="carrom-controls">
                    <label for="striker-slider">Striker Position:</label><br>
                    <input type="range" id="striker-slider" min="1" max="100" value="50">
                    <button class="btn-shoot" onclick="shootStriker()">🎯 स्ट्राइकर मारें (HIT)</button>
                </div>
            </div>
            <br>
            <button class="btn btn-back" onclick="exitCarrom()">❌ खेल बंद करें</button>
        </div>
    </div>

    <script>
        var turns = ["🔴 Red Turn", "🟢 Green Turn", "🟡 Yellow Turn", "🔵 Blue Turn"];
        var carromTurns = ["⚪ White Turn", "⚫ Black Turn"];
        var currentTurn = 0;
        var carromTurn = 0;
        var activePlayers = 2;
        var activeCarromPlayers = 2;

        function openLudo() {
            var name = document.getElementById("username").value || "खिलाड़ी";
            document.getElementById("page-1").classList.remove("active");
            document.getElementById("page-2").classList.add("active");
            document.getElementById("ludo-user").innerText = "चलो खेलते हैं, " + name + "!";
            exitLudo();
        }

        function openCarrom() {
            var name = document.getElementById("username").value || "खिलाड़ी";
            document.getElementById("page-1").classList.remove("active");
            document.getElementById("page-3").classList.add("active");
            document.getElementById("carrom-user").innerText = "चलो खेलते हैं, " + name + "!";
            exitCarrom();
        }

        function backHome() {
            document.getElementById("page-2").classList.remove("active");
            document.getElementById("page-3").classList.remove("active");
            document.getElementById("page-1").classList.add("active");
        }

        function selectLudoMode(mode) {
            if(mode === 'friends') {
                document.getElementById("ludo-players-section").style.display = "block";
            } else {
                document.getElementById("ludo-players-section").style.display = "none";
                startLudoGame(2);
            }
        }

        function selectCarromMode(mode) {
            if(mode === 'friends') {
                document.getElementById("carrom-players-section").style.display = "block";
            } else {
                document.getElementById("carrom-players-section").style.display = "none";
                startCarromGame(2);
            }
        }

        function startLudoGame(players) {
            activePlayers = players;
            currentTurn = 0;
            document.getElementById("ludo-setup").style.display = "none";
            document.getElementById("ludo-gameplay").style.display = "block";
            document.getElementById("ludo-turn").innerText = turns[currentTurn];
            document.getElementById("dice-num").innerText = "1";
        }

        function exitLudo() {
            document.getElementById("ludo-gameplay").style.display = "none";
            document.getElementById("ludo-setup").style.display = "block";
            document.getElementById("ludo-players-section").style.display = "none";
        }

        function rollDice() {
            var rand = Math.floor(Math.random() * 6) + 1;
            document.getElementById("dice-num").innerText = rand;
            currentTurn = (currentTurn + 1) % activePlayers;
            document.getElementById("ludo-turn").innerText = turns[currentTurn];
        }

        function startCarromGame(players) {
            activeCarromPlayers = players;
            carromTurn = 0;
            document.getElementById("carrom-setup").style.display = "none";
            document.getElementById("carrom-gameplay").style.display = "block";
            document.getElementById("carrom-turn-indicator").innerText = carromTurns[carromTurn];
        }

        function exitCarrom() {
            document.getElementById("carrom-gameplay").style.display = "none";
            document.getElementById("carrom-setup").style.display = "block";
            document.getElementById("carrom-players-section").style.display = "none";
        }

        function shootStriker() {
            alert("🎯 स्ट्राइकर से शॉट लगा! गोटियाँ बिखर गईं।");
            carromTurn = (carromTurn + 1) % activeCarromPlayers;
            document.getElementById("carrom-turn-indicator").innerText = carromTurns[carromTurn];
        }

        function toggleVolume(game) {
            var btn = document.getElementById(game + "-vol-btn");
            if(btn.innerText.includes("ON")) {
                btn.innerText = "🔇 Volume: OFF";
                btn.style.background = "#555";
            } else {
                btn.innerText = "🔊 Volume: ON";
                btn.style.background = "#e94560";
            }
        }
    </script>
</body>
</html>
